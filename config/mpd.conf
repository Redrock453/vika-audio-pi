# Vika Audio Pi — MPD configuration (staged, not yet accepted on hardware)
#
# Target: Raspberry Pi 3 A+ 512 MiB, Raspberry Pi OS Lite 32-bit (Trixie).
# Installed path: /etc/vika-audio/mpd.conf
# Started by:     systemd/vika-audio.service (User=vika, --no-daemon)
#
# Design rules:
#   * local files only; no TCP listener by default. A machine-local
#     include (below) may add one for LAN control apps such as MALP;
#   * analog onboard jack first (plughw:0,0), Bluetooth is optional and off;
#   * MPD writes only to /var/lib/vika-audio (systemd StateDirectory);
#   * USB flash is mounted read-only by scripts/usb-media.sh inside
#     /home/vika/media/usb, so it appears in the library as "usb/...".
#
# This file contains no secrets and no per-device identifiers.

music_directory     "/home/vika/media"
playlist_directory  "/var/lib/vika-audio/playlists"
db_file             "/var/lib/vika-audio/mpd.db"
state_file          "/var/lib/vika-audio/mpd.state"

# Local UNIX socket for every Vika script and for mpc (MPD_HOST=<this path>).
# The optional include below is the only way to add a TCP listener.
bind_to_address     "/run/vika-audio/mpd.sock"

# Optional machine-local overrides, never committed. On a Pi that must be
# controllable from a phone (MALP, MPDroid), this file adds:
#   bind_to_address "0.0.0.0"
# which opens the standard MPD port 6600 on the local network only (the Pi
# has no internet-facing listeners). See docs/MPD_DEPLOY.md.
include_optional    "/etc/vika-audio/mpd.local.conf"

# Restored queue starts paused; scripts/boot-play.sh decides whether to play.
# Set VIKA_BOOT_AUTOPLAY=0 in /etc/vika-audio/vika-audio.env to keep it paused.
restore_paused      "yes"

# Library changes are applied explicitly (mpc update) by play-source.sh and
# usb-media.sh; continuous rescans are too costly on a 512 MiB Pi and an SD card.
auto_update         "no"

# Keep the buffer modest on 512 MiB of RAM. If audio ever stutters on the
# onboard jack, raise this to 8192 before touching anything else.
max_output_buffer_size "4096"

log_level           "notice"

# ---------------------------------------------------------------------------
# Primary output: 3.5 mm analog jack on the Pi.
# plughw converts whatever the file uses to 44.1 kHz/16-bit/stereo, which the
# bcm2835 headphone output handles reliably. Software mixing avoids depending
# on a hardware mixer that may be absent or muted in a headless setup.
# ---------------------------------------------------------------------------
audio_output {
    type        "alsa"
    name        "Analog 3.5mm (plughw:0,0)"
    device      "plughw:0,0"
    mixer_type  "software"
    format      "44100:16:2"
    enabled     "yes"
}

# ---------------------------------------------------------------------------
# Optional Bluetooth output (BlueALSA). DISABLED BY DEFAULT AND NOT ACCEPTED.
#
# Do not enable until A2DP is proven stable on this Pi (see docs/SPEC.md).
# Install packages with: scripts/install.sh --apply --with-bluetooth
# Find the device string with: bluealsa-aplay -L
# Then uncomment, put the real MAC address in place of the placeholder, run
# `systemctl restart vika-audio`, and switch with:
#   MPD_HOST=/run/vika-audio/mpd.sock mpc enable "Bluetooth (BlueALSA)"
#   MPD_HOST=/run/vika-audio/mpd.sock mpc disable "Analog 3.5mm (plughw:0,0)"
#
# audio_output {
#     type        "alsa"
#     name        "Bluetooth (BlueALSA)"
#     device      "bluealsa:DEV=XX:XX:XX:XX:XX:XX,PROFILE=a2dp"
#     mixer_type  "software"
#     enabled     "no"
# }
